name: Release

# Pushing a tag like v0.2.1 builds, tests and STAGES that version on npm with provenance (a signed
# statement that it was built here, from this commit). Nothing goes public until a maintainer
# approves the staged version with 2FA on npmjs.com. No npm token is stored: the npm package trusts
# this workflow through OIDC (configured once in the package's npm settings).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm issue a short-lived publish token and sign provenance
    steps:
      # Actions pinned to commit SHAs: a moved or hijacked tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports staged publishing
        run: npm install -g npm@11.19.0
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npx tsc
      - run: npm test
      - name: Stage on npm with provenance
        run: npm stage publish --provenance --access public
